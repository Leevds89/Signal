services:
  - type: web
    name: klopkruis-signal
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /app/data/signal.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: signal-data
      mountPath: /app/data
      sizeGB: 10
